server:
  port: 8080

spring:
  application:
    name: polizas
  datasource:
    url: jdbc:h2:mem:polizasdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  api-key: "123456"
  # Variación anual del IPC aplicada en la renovación (0.052 = 5,2 %)
  ipc: 0.052
  core:
    url: http://localhost:${server.port:8080}/core-mock/evento
